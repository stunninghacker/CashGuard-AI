dataset:
  months: 6
  n_complaints: 12000
  n_atms_per_city: 180
  n_withdrawals: 200000
  fraud_share: 0.1
  fraud_share_source_status: assumption_general_literature
  fraud_share_citation: Synthetic label density; real-world per-withdrawal fraud rate
    is not public.
  complaint_types:
  - phishing
  - investment_fraud
  - job_fraud
  - upi_fraud
  - digital_arrest
  - sextortion
clustering:
  hot_atm_fraction: 0.12
  hot_atm_fraction_source_status: assumption_general_literature
  hot_atm_fraction_citation: 'Direction verified (I4C Suspect Registry + public reporting:
    mule activity and cash-out concentrate in few hubs/institutions); exact share
    not public.'
  pareto_skew: 1.8
  pareto_skew_source_status: assumption_general_literature
  pareto_skew_citation: No granular per-ATM public data; heavy-tailed direction verified
    only.
  clustering_direction_source_status: verified_pattern
  clustering_direction_citation: 'I4C Suspect Registry (launched 2024, bank/FI participation)
    and public reporting document concentration of mule activity. NOTE: Nuh/Jamtara
    are documented SCAM-ORIGIN hubs, not cash-WITHDRAWAL hubs — withdrawal geography
    may differ.'
behaviour:
  mule_velocity_mean_inr_h: 60000
  mule_velocity_source_status: verified_pattern
  mule_velocity_citation: 'IBA/RBI commentary on mule accounts: rapid fund movement
    (velocity). Direction verified; magnitude is a modelling choice.'
  mule_counterparty_min: 5
  mule_counterparty_source_status: verified_pattern
  mule_counterparty_citation: 'IBA mule-account red flags: unusually high counterparty
    count. Direction verified.'
  mule_txn_frequency_min: 3
  mule_txn_frequency_source_status: verified_pattern
  mule_txn_frequency_citation: 'IBA mule-account red flags: frequent transactions.
    Direction verified.'
  night_weight: 2.0
  night_weight_source_status: assumption_general_literature
  night_weight_citation: No India-specific public statistic; general fraud literature.
  weekend_weight: 1.9
  weekend_weight_source_status: assumption_general_literature
  weekend_weight_citation: No India-specific public statistic; general fraud literature.
  round_amount_bias: 0.4
  round_amount_source_status: assumption_general_literature
  round_amount_citation: Structured/round denominations; no India-specific statistic.
timing:
  fraud_to_cashout_mean_hours: 18
  fraud_to_cashout_source_status: assumption_general_literature
  fraud_to_cashout_citation: Right-skewed (most withdrawals soon after fraud, long
    tail); no India-specific public statistic.
  horizon_hours: 24
  horizon_source_status: verified_pattern
  horizon_citation: 'RBI direction: time-delays/holds on certain UPI transfers create
    a fraud-interception window before funds move — making a 6-24h prediction horizon
    operationally relevant. Specific hold values are NOT asserted (confirm against
    the exact RBI circular).'
scenario:
  final_wave_share: 0.06
  final_wave_share_source_status: assumption_general_literature
  final_wave_share_citation: Demo scenario shaping (an ongoing wave makes the live
    forecast hot); no real-world equivalent.
  hot_atm_use_prob: 0.4
  hot_atm_use_prob_source_status: assumption_general_literature
  hot_atm_use_prob_citation: Modelling choice; tuned so precision@K is strong-but-imperfect
    (label-leak guardrail).
  mule_burst_prob: 0.42
  mule_burst_prob_source_status: assumption_general_literature
  mule_burst_prob_citation: Modelling choice for bursty cash-out patterns.
  mule_same_atm_prob: 0.15
  mule_same_atm_prob_source_status: assumption_general_literature
  mule_same_atm_prob_citation: Modelling choice; lowered to avoid near-perfect persistence.
  random_atm_fraud_prob: 0.15
  random_atm_fraud_prob_source_status: assumption_general_literature
  random_atm_fraud_prob_citation: Modelling choice; adds noise for honest separability.
  blocked_burst_prob: 0.36
  blocked_burst_prob_source_status: assumption_general_literature
  blocked_burst_prob_citation: Modelling choice; simulates prevented cash-outs (mule
    detected / account frozen / limits) creating realistic near-miss ATM-days.
  hot_rotation_days: 14
  busy_atm_share: 0.08
  busy_chunk_share: 0.018
  amount_noise_sigma: 0.7
  hour_jitter_prob: 0.2
pii:
  pseudonymize: true
  pseudonymize_source_status: verified_pattern
  pseudonymize_citation: DPDP-Act-aligned data minimization; NCRP/CFCFRMS practice;
    govt scoring concern.
  anti_profiling: true
  anti_profiling_source_status: verified_pattern
  anti_profiling_citation: Risk = transaction behaviour + complaint linkage + transaction
    geography only (enforced in code; see LIMITATIONS.md).
transfers:
  # Money-trail graph (mandate: mule-account/money-trail module).
  # Each fraud complaint's linked (terminal/cash-out) mule account is fed by a
  # synthetic chain: entry(source) -> hop(s) -> terminal(mule). Terminal mules
  # are exactly the accounts that make the ATM fraud cash-outs, so graph
  # terminal-node risk is a genuine predictive signal, not decoration.
  n_entry_nodes: 6000
  n_benign_edges: 40000
  chain_depth_min: 1
  chain_depth_max: 3
  chain_depth_source_status: assumption_general_literature
  chain_depth_source_citation: Real fraud money trails are multi-hop through layering
    accounts before cash-out (RBI/FATF guidance); hop count is not a public statistic,
    so a short 1-3 hop chain is a modelling choice.
  entry_to_terminal_share: 1.0
  entry_to_terminal_share_source_status: assumption_general_literature
  entry_to_terminal_share_citation: Every synthetic mule is modelled as cash-out at an
    ATM, so every entry is modelled as terminating at that ATM-cash-out mule. Real
    networks also have non-withdrawing mules; noted as a simplification in LIMITATIONS.md.
  edge_mix_fraction: 0.35
  edge_mix_fraction_source_status: assumption_general_literature
  edge_mix_fraction_citation: Layering mixes amounts across hops before a lump cash-out;
    mixing ratio is a modelling choice.
  benign_recipient_overlap: 0.5
  benign_recipient_overlap_source_status: assumption_general_literature
  benign_recipient_overlap_citation: Background transfer graph shares some nodes with
    the mule subgraph so terminal detection must separate signal from noise.
ui:
  fictional_locations: true
  footer_banner: Hackathon Prototype — Synthetic Data. Locations are fictionalized
    for demonstration.
