# Render Blueprint — CashGuard AI (live demo deployment)
#
# Deploy with the Render Blueprint (render.yaml) or drag this repo into Render.
# Requires a persistent Disk so the SQLite db + training artifacts survive restarts.
# Health check pings GET /health (FastAPI) after the first-boot data/train pipeline.
#
# NOTE (honesty): the demo runs on synthetic data only. No real personal data,
# no production credentials. Live frontend URL is a placeholder until deployed —
# see LIVE_DEMO.md / README "Live demo" section.
services:
  - type: web
    name: cashguard-ai
    runtime: docker
    repo: https://github.com/stunninghacker/CashGuard-AI
    plan: starter
    dockerContext: .
    regions:
      - oregon
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: ALLOW_TAMPER_DEMO
        value: "false"
      - key: DATA_DIR
        value: /app/data
      # Keep the trained model + metrics on the persistent disk too, so a
      # container restart does NOT retrain from scratch (ARTIFACT_DIR defaults
      # to the ephemeral image path and would be lost each restart).
      - key: ARTIFACT_DIR
        value: /app/data/artifacts
      # SECURITY: the API refuses to boot with the public default JWT secret
      # (red-team finding 1: HS256 token forgery => full I4C_ADMIN). This demo
      # deployment explicitly opts into the INSECURE default because it only
      # serves SYNTHETIC data behind DEMO_MODE=true. For any non-demo deploy,
      # DELETE this var and instead inject a strong random secret:
      #   - key: JWT_SECRET        sync: false
      - key: ALLOW_INSECURE_DEFAULT_JWT
        value: "true"
      # On-chain anchoring starts as NOT configured (honest). When a funded
      # Polygon Amoy wallet is provided, uncomment so /ledger/verify-onchain
      # reports against a real chain root:
      #   - key: LEDGER_ANCHOR_RPC_URL      sync: false
      #   - key: LEDGER_ANCHOR_PRIVATE_KEY  sync: false
      #   - key: LEDGER_ANCHOR_CONTRACT_ADDRESS  sync: false
      # In production you would inject real secrets ONLY here (never in code):
      #   - key: JWT_SECRET        sync: false
      #   - key: WEBHOOK_URL       sync: false
      #   - key: CFCFRMS_WEBHOOK_URL sync: false
    healthCheckPath: /health
    disk:
      name: cashguard-data
      mountPath: /app/data
      sizeGB: 1
    autoDeploy: true
